<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | CertiChain</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f3f6fa}.box{max-width:420px;margin:10vh auto;background:white;padding:32px;border-radius:14px;border:1px solid #e3e8ef}</style>  <link rel="stylesheet" href="/assets/app.css">
</head><body>

<header class="cc-header">
  <a class="cc-brand" href="/">CertiChain<span>.</span></a>
  <nav class="cc-nav">
    <a href="/">Home</a>
    <a href="/verify/">Verify Certificate</a>
    <a href="/student/login.html">Student</a>
    <a class="cc-nav-primary" href="/admin/login.html">Admin</a>
  </nav>
</header>
<div class="box"><h3>CertiChain Admin</h3><p class="text-secondary">Sign in to manage credentials</p><div id="msg"></div><form id="f"><input class="form-control mb-3" name="email" type="email" placeholder="Admin email" required><input class="form-control mb-3" name="password" type="password" placeholder="Password" required><button class="btn btn-primary w-100">Sign in</button></form><a href="/student/" class="d-block mt-3">Student portal</a></div><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();if(!r.ok){msg.innerHTML='<div class="alert alert-danger">'+d.error+'</div>';return}if(d.user.role!=='admin'){await fetch('/api/auth/logout',{method:'POST'});msg.innerHTML='<div class="alert alert-danger">Admin account required.</div>';return}location='/admin/'};</script></body></html>
