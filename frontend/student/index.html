<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal | CertiChain</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f6fa}.card{border-radius:12px;border:1px solid #e3e8ef}</style>  <link rel="stylesheet" href="/assets/app.css">
</head><body>

<header class="cc-header">
  <a class="cc-brand" href="/">CertiChain<span>.</span></a>
  <nav class="cc-nav">
    <a href="/">Home</a>
    <a href="/verify/">Verify Certificate</a>
    <a href="/student/login.html">Student</a>
    <a class="cc-nav-primary" href="/admin/login.html">Admin</a>
  </nav>
</header>
<div class="container py-5"><div class="d-flex justify-content-between"><div><h3>CertiChain Student Portal</h3><p class="text-secondary">Your verified academic credentials</p></div><button class="btn btn-outline-secondary btn-sm" onclick="logout()">Logout</button></div><div id="app" class="card p-4"></div></div><script>
async function api(u,o){let r=await fetch(u,{credentials:'include',...o}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function init(){try{let me=await api('/api/auth/me');if(!me.user){location='/student/login.html';return}if(me.user.role!=='student'){location='/admin/';return}let d=await api('/api/student/certificates');app.innerHTML='<h5>Welcome, '+me.user.fullName+'</h5><p class="text-secondary">'+me.user.email+'</p>';if(!d.certificates.length){app.innerHTML+='<p>No certificates have been assigned to this email yet.</p>';return}d.certificates.forEach(c=>{let el=document.createElement('div');el.className='border rounded p-3 mb-3';el.innerHTML='<b>'+c.title+'</b><div>'+c.institution+'</div><div class="small text-secondary">'+c.certificateId+'</div>';let status=document.createElement('div');status.textContent=c.ledger?(c.ledger.revoked?'REVOKED':'ACTIVE'):'Ledger record unavailable';el.append(status);let a=document.createElement('a');a.className='btn btn-sm btn-outline-primary mt-2 me-2';a.href='/verify/?id='+encodeURIComponent(c.certificateId);a.textContent='Verify / QR';el.append(a);if(c.ledger&&!c.ledger.revoked){let dl=document.createElement('a');dl.className='btn btn-sm btn-outline-secondary mt-2';dl.href='/api/certificates/'+encodeURIComponent(c.certificateId)+'/document';dl.textContent='Download PDF';el.append(dl)}app.append(el)})}catch(e){app.textContent=e.message}}
async function logout(){await api('/api/auth/logout',{method:'POST'});location='/student/login.html'}init();
</script></body></html>
