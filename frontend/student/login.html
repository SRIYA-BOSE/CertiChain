<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | CertiChain</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f3f6fa}.box{max-width:450px;margin:7vh auto;background:white;padding:30px;border:1px solid #e3e8ef;border-radius:14px}</style>  <link rel="stylesheet" href="/assets/app.css">
</head><body>

<header class="cc-header">
  <a class="cc-brand" href="/">CertiChain<span>.</span></a>
  <nav class="cc-nav">
    <a href="/">Home</a>
    <a href="/verify/">Verify Certificate</a>
    <a href="/student/login.html">Student</a>
    <a class="cc-nav-primary" href="/admin/login.html">Admin</a>
  </nav>
</header>
<div class="box"><h3>Student Portal</h3><div id="msg"></div><ul class="nav nav-tabs mb-3"><li class="nav-item"><button class="nav-link active" id="loginTab" onclick="mode(false)">Login</button></li><li class="nav-item"><button class="nav-link" id="regTab" onclick="mode(true)">Register</button></li></ul><form id="f"><div id="nameWrap" class="d-none"><input class="form-control mb-2" name="fullName" placeholder="Full name"></div><div id="studentWrap" class="d-none"><input class="form-control mb-2" name="studentId" placeholder="Student ID (optional)"></div><input class="form-control mb-2" name="email" type="email" placeholder="Email" required><input class="form-control mb-3" name="password" type="password" placeholder="Password (8+ characters)" required><button class="btn btn-primary w-100" id="submit">Login</button></form><a href="/admin/login.html" class="d-block mt-3">Admin login</a></div><script>let registering=false;function mode(v){registering=v;nameWrap.classList.toggle('d-none',!v);studentWrap.classList.toggle('d-none',!v);loginTab.classList.toggle('active',!v);regTab.classList.toggle('active',v);submit.textContent=v?'Create student account':'Login'}f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/'+(registering?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();if(!r.ok){msg.innerHTML='<div class="alert alert-danger">'+d.error+'</div>';return}if(d.user.role!=='student'){await fetch('/api/auth/logout',{method:'POST'});msg.innerHTML='<div class="alert alert-danger">Student account required.</div>';return}location='/student/'};</script></body></html>
