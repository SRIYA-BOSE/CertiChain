<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify | CertiChain</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{background:#f4f6fa}.card{max-width:760px;margin:6vh auto;border-radius:14px}.mono{font-family:monospace;overflow-wrap:anywhere}</style>  <link rel="stylesheet" href="/assets/app.css">
</head><body>

<header class="cc-header">
  <a class="cc-brand" href="/">CertiChain<span>.</span></a>
  <nav class="cc-nav">
    <a href="/">Home</a>
    <a href="/verify/">Verify Certificate</a>
    <a href="/student/login.html">Student</a>
    <a class="cc-nav-primary" href="/admin/login.html">Admin</a>
  </nav>
</header>
<div class="container"><div class="card p-4"><h3>CertiChain Public Verification</h3><p class="text-secondary">Check the blockchain record and verify the original PDF hash.</p><form id="f"><input id="id" class="form-control mb-2" placeholder="Certificate ID" required><input id="pdf" type="file" accept="application/pdf" class="form-control mb-3"><button class="btn btn-primary">Verify certificate</button></form><div id="result" class="mt-3"></div><button id="qr" class="btn btn-outline-secondary btn-sm mt-3">Generate QR code</button><div id="code" class="mt-3"></div><a href="/student/" class="d-block mt-3">Student portal</a></div></div><script>
const params=new URLSearchParams(location.search);if(params.get('id'))id.value=params.get('id');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
f.onsubmit=async e=>{e.preventDefault();let ident=id.value.trim(),file=pdf.files[0],r,d;if(file){let fd=new FormData();fd.append('certificateId',ident);fd.append('certificate',file);r=await fetch('/api/certificates/verify',{method:'POST',body:fd})}else r=await fetch('/api/public/verify/'+encodeURIComponent(ident));d=await r.json();let c=d.status==='REVOKED'?'danger':d.status==='VALID'||d.status==='RECORDED'?'success':'warning';result.innerHTML=`<div class="alert alert-${c}"><b>${esc(d.status||'ERROR')}</b><br>${esc(d.message||d.error)}</div>`+(d.record||d.certificateId?`<p><b>Certificate:</b> ${esc(d.record?.certificateId||d.certificateId)}<br><b>Issued:</b> ${esc(d.record?.issuedAt||d.issuedAt||'—')}<br><b>Issuer:</b> ${esc(d.record?.issuerMspId||d.issuerMspId||'—')}<br><b>SHA-256:</b> <span class="mono">${esc(d.record?.documentHash||d.documentHash||d.uploadedHash||'')}</span></p>`:'')};
qr.onclick=()=>{if(!id.value.trim())return;code.innerHTML='';new QRCode(code,{text:location.origin+'/verify/?id='+encodeURIComponent(id.value.trim()),width:180,height:180})};
if(params.get('id'))f.requestSubmit();
</script></body></html>
